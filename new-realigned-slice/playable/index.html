<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦境邮局 · 开场空间实验</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#333d59;color:#eee7dd;font:16px/1.7 system-ui}canvas{display:block;touch-action:none}#note{position:fixed;top:20px;left:24px;max-width:29em;font-size:13px;color:#d6d7df;pointer-events:none}#hint{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:8px 20px;border:1px solid #e7e0d755;background:#333d59aa;color:inherit;border-radius:5px}dialog{background:#e8e1d6;color:#343b4d;border:1px solid #92877b;border-radius:4px;padding:30px;max-width:min(430px,90vw);box-shadow:0 15px 80px #0008}dialog::backdrop{background:#20293b77}pre{font:18px/2.1 serif;white-space:pre-wrap}button{font:inherit;cursor:pointer}dialog button{border:0;border-bottom:1px solid #a09482;background:none;color:inherit;padding:8px 16px}#touch{position:fixed;bottom:25px;left:20px;display:flex;gap:6px}#touch button{background:#333d5977;border:1px solid #e7e6e877;color:#eee;padding:8px 13px;touch-action:none}@media(pointer:fine){#touch{display:none}}
#letter{margin:0;left:24px;right:auto;top:50%;transform:translateY(-50%);width:min(340px,35vw);max-width:none;padding:22px}#letter::backdrop{background:#20293b22}#letter pre{font-size:17px;line-height:1.9}@media(max-width:700px){#letter{left:12px;right:12px;top:auto;bottom:12px;transform:none;width:calc(100% - 24px);max-height:40vh;overflow:auto;padding:18px}#letter pre{font-size:16px;line-height:1.65;margin:0 0 8px}}
#objective{position:fixed;top:112px;left:24px;max-width:min(320px,calc(100vw - 48px));padding:10px 14px;border-left:2px solid #c5bda5;background:#273448b8;font-size:13px;pointer-events:none}#objective-title{display:block;color:#eee7dd;font-size:15px}#objective-detail{display:block;color:#cbd5de}#objective-bearing{display:block;color:#e0d3b9;margin-top:3px}#objective-marker{position:fixed;transform:translate(-50%,-50%);font-size:12px;padding:3px 8px;border:1px solid #dfdcc277;border-radius:12px;background:#273448a8;color:#eee7dd;pointer-events:none}@media(max-width:700px){#observe-water{top:auto!important;bottom:110px;right:20px}#objective{top:94px;font-size:12px;max-width:240px}#note{font-size:11px;max-width:calc(100vw - 48px)}}
/* Dedicated top row: sound never occupies movement, hint or F controls. */
#sound-toggle{position:fixed;top:6px;right:20px;z-index:4;min-height:34px;padding:3px 12px;font-size:13px;color:#eee7dd;background:#273448dd;border:1px solid #c5bda588;border-radius:5px}
#note{top:64px}#objective{top:156px}#observe-water{top:114px!important}
@media(max-width:700px){#note{line-height:1.5}#objective{top:138px}#observe-water{top:auto!important;bottom:110px}}
</style><button id="sound-toggle" hidden type="button" aria-pressed="false" title="默认关闭；离开窗口后需再次点击开启。此按钮表示开关意图，不检测设备输出。">开启声音</button><div id="note">开场空间实验 · 非参赛成品<br>WASD 移动，拖动视角，滚轮调整距离，E 读信。<br>场景/动作仍在评审，离线图不等于实机效果。</div><div id="objective" hidden><strong id="objective-title" aria-live="polite"></strong><span id="objective-detail"></span><span id="objective-bearing"></span></div><div id="objective-marker" aria-hidden="true" hidden></div><button id="hint" hidden>读信 · E</button><div id="touch"><button data-key="a">←</button><button data-key="w">↑</button><button data-key="s">↓</button><button data-key="d">→</button></div><dialog id="letter"><pre></pre><button id="close">放回信件</button></dialog><dialog id="failure"><p id="failure-text"></p><button onclick="location.reload()">重新尝试</button></dialog><script type="module" src="main.js"></script></html>
