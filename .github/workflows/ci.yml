name: Campus prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/test_augment_buildings.py
      - run: python scripts/art/verify_mechanical_hall.py public/assets/campuses/yingxi
      - run: python scripts/landmarks/meihua/verify.py
      - run: python scripts/landmarks/gate/verify_portable.py
      - run: python scripts/test_spatial_models.py
      - run: python scripts/build_spatial_data.py
      - run: git diff --exit-code -- src/campus-data/spatial.json src/campus-data/mechanical-hall-model.json src/campus-data/huyu-models.json public/data/campus-spatial.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/explore.spec.ts --output=test-results/http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-browser-report
          path: |
            playwright-report/
            test-results/
            survival-playwright-report/
          retention-days: 7

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build self-contained offline delivery
        run: bash scripts/offline/package.sh "$PWD" "$RUNNER_TEMP/campus-offline-work"
      - name: Verify real file protocol delivery
        run: OFFLINE_HTML="$RUNNER_TEMP/campus-offline-work/package/index.html" npx playwright test --config scripts/offline/playwright.config.ts --output=test-results/offline
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: campus-offline-playable
          path: ${{ runner.temp }}/campus-offline-work/campus-offline.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-offline-browser-report
          path: |
            offline-playwright-report/
            test-results/offline/
          retention-days: 7

  hks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Hks real menu, play, replay and landscape input
        run: npm run test:e2e -- tests/e2e/hks.spec.ts --output=test-results/hks
      - name: Natural Hks play trial
        if: contains(github.event.head_commit.message, '[playtrial]')
        run: PLAYWRIGHT_HTML_OUTPUT_DIR=survival-playwright-report RUN_HKS_SURVIVAL=1 HKS_TRIAL_CODE_IDENTITY="$GITHUB_SHA" npm run test:e2e -- tests/e2e/hks-survival.spec.ts --workers=1 --retries=0 --output=test-results/survival
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-hks-browser-report
          path: |
            playwright-report/
            test-results/
            survival-playwright-report/
          retention-days: 7

  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real headed browser focus and missed-keyup recovery
        run: RUN_HEADED_FOCUS=1 xvfb-run -a npm run test:e2e -- tests/e2e/focus.spec.ts --headed --output=test-results/focus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-focus-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
