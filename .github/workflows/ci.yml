name: Campus prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/test_augment_buildings.py
      - run: python scripts/art/verify_mechanical_hall.py public/assets/campuses/yingxi
      - run: python scripts/art/qingze-garden/verify.py
      - run: python scripts/landmarks/meihua/verify.py
      - run: python scripts/landmarks/gate/verify_portable.py
      - run: python scripts/test_spatial_models.py
      - run: python scripts/build_spatial_data.py
      - run: git diff --exit-code -- src/campus-data/spatial.json src/campus-data/mechanical-hall-model.json src/campus-data/huyu-models.json public/data/campus-spatial.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/explore.spec.ts --output=test-results/http
      - name: Screen-relative keyboard and touch directions
        run: npm run test:e2e -- tests/e2e/control-direction.spec.ts --output=test-results/control-direction
      - name: Base and ideal campus switching, shared-ground safety and persistence
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- tests/e2e/campus-mode.spec.ts --grep-invert "actual joystick and touch mode swaps preserve pose and report natural adaptive quality$" --output=test-results/campus-mode-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-browser-report
          path: |
            playwright-report/
            test-results/
            survival-playwright-report/
          retention-days: 7

  two-campus-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Two-campus desktop and landscape touch release journeys
        run: npm run test:e2e -- tests/e2e/two-campus-release.spec.ts --output=test-results/two-campus
      - name: Current-campus minimap desktop and landscape touch
        if: always()
        run: npm run test:e2e -- tests/e2e/minimap.spec.ts --output=test-results/minimap
      - name: Natural automatic-quality campus arrival journeys
        if: ${{ !cancelled() }}
        run: npm run test:e2e -- tests/e2e/campus-arrival.spec.ts --output=test-results/campus-arrival
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-two-campus-release-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build self-contained offline delivery
        run: bash scripts/offline/package.sh "$PWD" "$RUNNER_TEMP/campus-offline-work"
      - name: Verify real file protocol delivery
        run: OFFLINE_HTML="$RUNNER_TEMP/campus-offline-work/package/index.html" npx playwright test --config scripts/offline/playwright.config.ts --output=test-results/offline
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: campus-offline-playable
          path: ${{ runner.temp }}/campus-offline-work/campus-offline.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-offline-browser-report
          path: |
            offline-playwright-report/
            test-results/offline/
          retention-days: 7

  hks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Hks real menu, play, replay and landscape input
        run: npm run test:e2e -- tests/e2e/hks.spec.ts --output=test-results/hks
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          ref: c17b46220743fe0059bf5b3bfedacebe37a1212a
          path: reference-baseline
          persist-credentials: false
      - name: Fixed-quality old/new visual reference on separate static builds
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C reference-baseline rev-parse HEAD)" = c17b46220743fe0059bf5b3bfedacebe37a1212a
          cmp package-lock.json reference-baseline/package-lock.json
          cmp games/hks/package-lock.json reference-baseline/games/hks/package-lock.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('tests/e2e/reference-baseline-manifest.json','utf8'));
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          if(m.baselineCommit!=='c17b46220743fe0059bf5b3bfedacebe37a1212a'||m.requiresPatch!==false)throw Error('Baseline input contract mismatch');
          for(const entry of m.sourceFiles)if(hash('reference-baseline/'+entry.path)!==entry.sha256)throw Error('Baseline source identity mismatch: '+entry.path);
          console.log('[REFERENCE_INPUT]',JSON.stringify({...m,candidateCommit:process.env.GITHUB_SHA}));
          NODE
          test -z "$(git -C reference-baseline status --porcelain)"
          ln -s "$GITHUB_WORKSPACE/node_modules" reference-baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/games/hks/node_modules" reference-baseline/games/hks/node_modules
          npm --prefix reference-baseline run build
          npm run build
          python3 -m http.server 4174 --bind 127.0.0.1 --directory reference-baseline/dist > /tmp/campus-reference-before.log 2>&1 &
          BEFORE_PID=$!
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist > /tmp/campus-reference-after.log 2>&1 &
          AFTER_PID=$!
          trap 'kill "$BEFORE_PID" "$AFTER_PID" 2>/dev/null || true' EXIT
          for port in 4174 4175; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/" > /dev/null
          done
          BASELINE_REFERENCE_URL=http://127.0.0.1:4174 CANDIDATE_REFERENCE_URL=http://127.0.0.1:4175 npx playwright test --config tests/e2e/visual-reference.config.ts --output=test-results/visual-reference
      - name: Complete notebook, paperplane lifecycle and physical vertical exploration
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: core-playwright-report
        run: npm run test:e2e -- tests/e2e/complete-release.spec.ts tests/e2e/paperplane.spec.ts tests/e2e/vertical-exploration.spec.ts --output=test-results/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-core-browser-report
          path: |
            core-playwright-report/
            test-results/core/
          retention-days: 7
      - name: Natural Hks play trial
        if: contains(github.event.head_commit.message, '[playtrial]')
        run: PLAYWRIGHT_HTML_OUTPUT_DIR=survival-playwright-report RUN_HKS_SURVIVAL=1 HKS_TRIAL_CODE_IDENTITY="$GITHUB_SHA" npm run test:e2e -- tests/e2e/hks-survival.spec.ts --workers=1 --retries=0 --output=test-results/survival
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-hks-browser-report
          path: |
            playwright-report/
            visual-reference-report/
            test-results/hks/
            test-results/visual-reference/
            test-results/survival/
            survival-playwright-report/
          retention-days: 7

  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real headed browser focus and missed-keyup recovery
        run: RUN_HEADED_FOCUS=1 xvfb-run -a npm run test:e2e -- tests/e2e/focus.spec.ts --headed --output=test-results/focus
      - name: Natural adaptive touch mode, interaction and preserved state
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: touch-mode-playwright-report
        run: npm run test:e2e -- tests/e2e/campus-mode.spec.ts --grep "actual joystick and touch mode swaps preserve pose and report natural adaptive quality$" --output=test-results/touch-mode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-touch-mode-browser-report
          path: |
            touch-mode-playwright-report/
            test-results/touch-mode/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-focus-browser-report
          path: |
            playwright-report/
            test-results/focus/
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Scenic diary, animated student and full landscape touch journey
        run: npm run test:e2e -- tests/e2e/quality-slice.spec.ts --output=test-results/quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-quality-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  garden-render-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[renderdiag]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Controlled garden shadow diagnosis, not gameplay acceptance
        run: RUN_GARDEN_RENDER_DIAGNOSTIC=1 npm run test:e2e -- tests/e2e/garden-render-diagnostic.spec.ts --output=test-results/garden-render-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-garden-render-diagnostic
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hks-deepplay:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deepplay]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Bounded natural lives, no game-state injection
        run: RUN_HKS_DEEPPLAY=1 HKS_TRIAL_CODE_IDENTITY="$GITHUB_SHA" npm run test:e2e -- tests/e2e/hks-survival.spec.ts --workers=1 --retries=0 --output=test-results/deepplay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-hks-deepplay-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  hall-render-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[halldiag]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Fixed-camera doorway shadow experiment, not gameplay acceptance
        run: RUN_HALL_RENDER_DIAGNOSTIC=1 npm run test:e2e -- tests/e2e/hall-render-diagnostic.spec.ts --workers=1 --retries=0 --output=test-results/hall-render-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-hall-render-diagnostic
          path: |
            playwright-report/
            test-results/
          retention-days: 7
