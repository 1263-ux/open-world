name: Huyu pocket garden targeted QA
on:
  push:
    branches: ['dev/huyu-pocket-qa-*']
permissions:
  contents: read
jobs:
  actual-huyu-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix games/hks ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Genuine connected Huyu journey and wide views
        run: npm run test:e2e -- tests/e2e/two-campus-release.spec.ts --grep 'Huyu connected landmark journey' --output=test-results/huyu-pocket
      - name: Texture failure and delayed campus teardown
        if: always()
        run: npm run test:e2e -- tests/e2e/huyu-tree-lifecycle.spec.ts --output=test-results/huyu-tree-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huyu-pocket-qa-report
          path: |
            playwright-report/
            test-results/huyu-pocket/
            test-results/huyu-tree-lifecycle/
          retention-days: 7
